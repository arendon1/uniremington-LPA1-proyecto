<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="#{app.marca} + ' · ' + #{login.titulo}">Iniciar sesion</title>
	<link rel="stylesheet" th:href="@{/css/base.css}" />
	<link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
	<div class="pantalla-centrada">
		<div class="login-card">
			<div class="marca-login">
				<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
					<path d="M2 21c0-3 1.85-5.36 5.5-9C9 9.5 11 11 11 11" />
				</svg>
				<span th:text="#{app.marca}">RappiClon</span>
			</div>

			<div th:replace="~{fragments/switcher :: switcher(target=${rutaActual})}"></div>

			<h1 th:text="#{login.titulo}">Iniciar sesion</h1>
			<p class="subtitulo" th:text="#{login.subtitulo}">Entra a tu cuenta para pedir</p>

			<div class="mensaje-error" th:if="${param.error != null}" th:text="#{login.error}">Credenciales incorrectas.</div>
			<div class="mensaje-exito" th:if="${param.logout != null}" th:text="#{login.logout}">Cerraste sesion.</div>

			<form th:action="@{/login}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

				<div class="campo">
					<label for="username" th:text="#{login.usuario.label}">Usuario</label>
					<input type="text" id="username" name="username" th:placeholder="#{login.usuario.placeholder}" required autofocus />
				</div>

				<div class="campo">
					<label for="password" th:text="#{login.contrasena.label}">Contrasena</label>
					<input type="password" id="password" name="password" th:placeholder="#{login.contrasena.placeholder}" required />
				</div>

				<button type="submit" class="boton boton-primario boton-bloque" th:text="#{login.boton}">Entrar</button>
			</form>

			<p class="nota-credenciales" th:text="#{login.credenciales}">Demo: admin / admin123 - user / user123</p>

			<a th:href="@{/}" class="volver-tienda">
				<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="m15 18-6-6 6-6" />
				</svg>
				<span th:text="#{login.volver}">Volver a la tienda</span>
			</a>
		</div>
	</div>
</body>
</html>
