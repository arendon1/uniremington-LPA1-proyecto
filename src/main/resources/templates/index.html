<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="#{app.marca} + ' · ' + #{tienda.hero.titulo}">RappiClon</title>
	<link rel="stylesheet" th:href="@{/css/base.css}" />
	<link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
	<div th:replace="~{fragments/cabecera :: cabecera}"></div>

	<section class="hero">
		<div class="hero-interior">
			<h1 th:text="#{tienda.hero.titulo}">Comida a tu puerta en minutos</h1>
			<p class="tagline" th:text="#{tienda.hero.subtitulo}">Desde tu restaurante favorito hasta tu casa.</p>
			<div class="hero-acciones">
				<a sec:authorize="isAnonymous()" th:href="@{/login}" class="boton boton-primario boton-cta-login" th:text="#{tienda.cta.login}">Inicia sesion para pedir</a>
				<a sec:authorize="isAuthenticated()" th:href="@{/user}" class="boton boton-primario boton-cta-pedir" th:text="#{tienda.cta.pedir}">Hacer pedido</a>
				<a href="#populares" class="boton boton-linea boton-cta-explorar" th:text="#{tienda.populares.titulo}">Lo mas pedido</a>
			</div>
		</div>
	</section>

	<section class="seccion" id="populares">
		<div class="seccion-encabezado">
			<h2 th:text="#{tienda.populares.titulo}">Lo mas pedido</h2>
		</div>
		<div class="reja-productos">
			<th:block th:each="p : ${productos}">
				<article class="producto">
					<div class="producto-icono">
						<picture>
							<source th:srcset="@{'/images/productos/' + ${p.slug} + '.webp'}" type="image/webp" />
							<img th:src="@{'/images/productos/' + ${p.slug} + '.jpg'}" th:alt="#{|producto.${p.slug}.nombre|}" loading="lazy" />
						</picture>
					</div>
					<h3 class="producto-nombre" th:text="#{|producto.${p.slug}.nombre|}">Nombre</h3>
					<p class="producto-desc" th:text="#{|producto.${p.slug}.desc|}">Descripcion</p>
					<div class="producto-meta">
						<span class="meta-item"><span class="estrella">★</span> 4.8</span>
						<span class="meta-item" th:text="#{tienda.producto.eta}">25-40 min</span>
					</div>
					<div class="producto-precio-fila">
						<span class="producto-precio" th:text="${@precios.formatear(p.precioCop, #locale)}">COP 28.000</span>
						<span class="producto-unidad" th:text="#{|producto.unidad.${p.unidad}|}">porcion</span>
					</div>
					<button type="button" class="boton boton-primario producto-agregar" th:text="#{tienda.producto.agregar}">Agregar</button>
				</article>
			</th:block>
		</div>
	</section>

	<div th:replace="~{fragments/pie :: pie}"></div>
</body>
</html>
