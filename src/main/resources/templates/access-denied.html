<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="#{app.marca} + ' · ' + #{denied.titulo}">Acceso denegado</title>
	<link rel="stylesheet" th:href="@{/css/base.css}" />
	<link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
	<div class="pantalla-centrada">
		<div class="denied-card">
			<div th:replace="~{fragments/switcher :: switcher(target='/access-denied')}"></div>

			<svg class="denied-glyph" viewBox="0 0 24 24" fill="none" stroke="#c8442e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
				<path d="M7 11V7a5 5 0 0 1 10 0v4" />
			</svg>

			<h1 th:text="#{denied.titulo}">Acceso restringido</h1>
			<p class="subtitulo" th:text="#{denied.mensaje}">Esta zona es solo para administradores.</p>

			<div class="denied-acciones">
				<a th:href="@{/}" class="boton boton-primario" th:text="#{denied.cta.tienda}">Ir a la tienda</a>
				<a th:href="@{/login}" class="boton boton-fantasma" th:text="#{denied.cta.cambiar}">Entrar con otra cuenta</a>
			</div>
		</div>
	</div>
</body>
</html>
