<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="#{app.marca} + ' · ' + #{cuenta.titulo}">Mi cuenta</title>
	<link rel="stylesheet" th:href="@{/css/base.css}" />
	<link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
	<div th:replace="~{fragments/cabecera :: cabecera}"></div>

	<main class="cuenta">
		<div class="cuenta-saludo" th:text="#{cuenta.saludo(${nombre})}">Hola, usuario. Esta es tu zona.</div>

		<div class="cuenta-bloque">
			<h2 th:text="#{cuenta.pedidos.titulo}">Tus pedidos</h2>
			<div class="pedidos-vacio" th:text="#{cuenta.pedidos.vacio}">Todavia no tienes pedidos.</div>
		</div>

		<div class="cuenta-acciones">
			<a th:href="@{/}" class="boton boton-primario boton-cta-cuenta" th:text="#{cuenta.cta.pedir}">Seguir pidiendo</a>
		</div>
	</main>

	<div th:replace="~{fragments/pie :: pie}"></div>
</body>
</html>
