spring.application.name=rappiclon
server.port=8080

# i18n / l10n (U2)
# Boot crea un ResourceBundleMessageSource automatico a partir de estas claves
# (MessageSourceAutoConfiguration). Sin bean Java custom.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Thymeleaf: prototipo educativo, no va a produccion.
# Recargar plantillas en cada request evita reinicios manuales al iterar UI.
spring.thymeleaf.cache=false