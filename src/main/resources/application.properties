spring.application.name=rappiclon
server.port=8080

# i18n / l10n (U2)
# Boot crea un ResourceBundleMessageSource automatico a partir de estas claves
# (MessageSourceAutoConfiguration). Sin bean Java custom.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Thymeleaf: prototipo educativo, no va a produccion.
# Recargar plantillas en cada request evita reinicios manuales al iterar UI.
spring.thymeleaf.cache=false

# U3: PostgreSQL 17 (localhost:5432; ver docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/rappiclon
spring.datasource.username=rappi
spring.datasource.password=rappi123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seed del catalogo (desactivar en tests)
app.seed.enabled=true

# Mailpit: SMTP local de captura (localhost:1025, UI en :8025)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false

# JWT (U3): secreto de desarrollo, rotar en produccion. HS256.
app.jwt.secret=5ec153f95e4bcc0049df0356f4bfd16b0a54e1b6b34418e0e7d1814d722d28cbd3d7c9ac419fa6a3f3f6f6bc0e69833c
app.jwt.horas=24